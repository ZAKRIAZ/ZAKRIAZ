<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Systems I connect: Shopify orders in and Salesforce CRM sync route into NetSuite, the ERP hub; NetSuite routes out through Orderful EDI translation to Amazon and Walmart EDI fulfilment. Celigo and Workato are the pipes.">
<title>SYSTEMS I CONNECT / integration map</title>
